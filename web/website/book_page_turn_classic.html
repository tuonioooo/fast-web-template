<!doctype html>
<html lang="zh-CN">
<head>

<title>经典书本翻页 · 原生页角拖动</title>
<style>
/* Independently authored implementation and inline artwork. No third-party runtime or image assets. */
*{box-sizing:border-box;margin:0;padding:0} [hidden]{display:none!important}
body{background:#2f2f2f;font-family:Arial,"Microsoft YaHei",sans-serif;color:#444}
button{font:inherit}button:focus-visible{outline:3px solid #c7a85b;outline-offset:5px}
.stage{min-height:100vh;min-height:max(100svh,550px);position:relative;display:grid;place-items:center;overflow:hidden}
.phone{width:280px;height:450px;padding:15px}
.frame{position:relative;width:250px;height:420px;border-radius:10px;background:#fff;overflow:hidden;perspective:1200px;box-shadow:0 3px 2px #00000009,0 7px 5px #0000000c,0 13px 10px #0000000f,0 23px 18px #00000012,0 42px 33px #00000015,0 100px 80px #0000001f;touch-action:pan-y}
.cover{position:absolute;left:50px;top:97.5px;width:150px;height:225px;z-index:5;border:0;border-radius:5px 10px 10px 5px;background:#b9c9ac;cursor:pointer;box-shadow:0 12px 6px -6px #0006,-8px 12px 6px -6px #0003,8px 12px 6px -6px #0003;transform-origin:top left;transition:left .3s,top .3s,width .3s,height .3s,transform .9s cubic-bezier(.645,.045,.355,1);-webkit-tap-highlight-color:transparent;overflow:hidden}
.cover svg{display:block;width:100%;height:100%;pointer-events:none}.cover::after{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:#0003;box-shadow:0 0 4px #0006}
.frame.opening .cover,.frame.open .cover{left:0;top:0;width:250px;height:420px;transform:rotateY(-180deg)}
.cover:disabled{cursor:default}.frame.closing .cover{left:50px;top:97.5px;width:150px;height:225px;transform:rotateY(0)}
.paper{position:absolute;inset:0;background:#fff;overflow:hidden}.surface{position:absolute;inset:0;background:#fff}.surface[aria-hidden="true"]{pointer-events:none}
.page{position:absolute;inset:0;padding:15px;display:flex;align-items:center;justify-content:center;background:#fff}
.page-inner{width:100%;text-align:center}.chapter{font-size:18px;line-height:1.25;font-weight:400;margin-bottom:10px}.copy{text-align:justify;font-size:12px;line-height:1.2;font-weight:400;color:#777}.folio{position:absolute;bottom:15px;left:0;right:0;text-align:center;font-size:12px;font-weight:400;color:#777}
.curl{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:3}.paper.ready{cursor:grab}.paper.turning{cursor:grabbing;user-select:none}
.hint{position:absolute;bottom:25px;left:12px;right:12px;text-align:center;color:#d9d9d9;font-size:16px;line-height:1.4;pointer-events:none}.keys{display:block;font-size:10px;color:#999;margin-top:7px;letter-spacing:.04em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:310px){.phone{transform:scale(.9)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

<template><article class="page" aria-label="第 4 页，共 4 页，结束"><div class="page-inner"><h1 class="chapter">Fin.</h1></div></article></template>
<script>
/* Original corner-fold renderer: perpendicular-bisector clipping and reflected paper geometry.
   No Turn.js, jQuery, TweenMax, external images, or copied library code.
   Visual interaction reference: https://codepen.io/gokulramesh94/pen/rNeMyop
   Design inspiration credited by that demo: https://dribbble.com/shots/13926352-E-Book-Page-Swipe-Animaiton
   Cover artwork and implementation in this file were independently authored. */
(() => {
'use strict';
const frame=document.querySelector('#frame'),cover=document.querySelector('#cover'),paper=document.querySelector('#paper'),current=document.querySelector('#current'),under=document.querySelector('#under'),curl=document.querySelector('#curl'),back=document.querySelector('#foldBack'),shadow=document.querySelector('#castShadow'),crease=document.querySelector('#crease'),tint=document.querySelector('#foldTint'),hint=document.querySelector('#hint'),status=document.querySelector('#status');
const pages=[...document.querySelectorAll('template')],reduced=matchMedia('(prefers-reduced-motion: reduce)');
const W=250,H=420,rectangle=[{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}];
let opened=false,index=0,mode='closed',fold=null,drag=null,raf=0,coverTimer=0,coverDone=null;
const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
function render(){current.replaceChildren(pages[index].content.cloneNode(true));paper.dataset.page=String(index+1);status.textContent=current.firstElementChild.getAttribute('aria-label');}
function busy(value){frame.setAttribute('aria-busy',String(value));cover.disabled=value;}
function hints(){hint.innerHTML=opened?'* 使用纸张两边页角进行翻页<span class="keys">← → 翻页 · Home / End 首尾 · Esc 合上</span>':'* 点击书打开它!<span class="keys">Enter 打开 · 原生交互，无外部依赖</span>';}
function coverWait(done){coverDone=()=>{clearTimeout(coverTimer);coverDone=null;done();};if(reduced.matches)coverDone();else coverTimer=setTimeout(()=>coverDone&&coverDone(),950);}
function openBook(){if(mode!=='closed')return;mode='opening';busy(true);index=0;render();paper.hidden=false;opened=true;cover.setAttribute('aria-expanded','true');frame.className='frame opening';hints();coverWait(()=>{cover.hidden=true;frame.className='frame open';mode='idle';busy(false);paper.classList.add('ready');paper.focus({preventScroll:true});});}
function closeBook(){if(!opened)return;cancelAnimationFrame(raf);if(coverDone){clearTimeout(coverTimer);coverDone=null;}clearFold();drag=null;mode='closing';busy(true);cover.hidden=false;frame.className='frame open';void cover.offsetWidth;frame.className='frame closing';coverWait(()=>{opened=false;paper.hidden=true;frame.className='frame';cover.setAttribute('aria-expanded','false');mode='closed';busy(false);hints();status.textContent='书已合上';cover.focus({preventScroll:true});});}
function clip(poly,n,m,sign){const out=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],fa=sign*((a.x-m.x)*n.x+(a.y-m.y)*n.y),fb=sign*((b.x-m.x)*n.x+(b.y-m.y)*n.y),insideA=fa<=0,insideB=fb<=0;if(insideA)out.push(a);if(insideA!==insideB){const t=fa/(fa-fb);out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});}}return out;}
function path(points){return points.length?'M'+points.map(p=>p.x.toFixed(2)+' '+p.y.toFixed(2)).join('L')+'Z':'';}
function draw(p){if(!fold)return;fold.point=p;const a={x:fold.direction===1?W:0,y:H},n={x:a.x-p.x,y:a.y-p.y},length=Math.hypot(n.x,n.y);if(length<.01)return;const m={x:(a.x+p.x)/2,y:(a.y+p.y)/2},front=clip(rectangle,n,m,1),turned=clip(rectangle,n,m,-1),reflected=turned.map(v=>{const d=((v.x-m.x)*n.x+(v.y-m.y)*n.y)/(length*length);return{x:v.x-2*d*n.x,y:v.y-2*d*n.y};});current.style.clipPath=front.length?'polygon('+front.map(v=>v.x+'px '+v.y+'px').join(',')+')':'polygon(0 0,0 0,0 0)';back.setAttribute('d',path(reflected));shadow.setAttribute('d',path(reflected.map(v=>({x:v.x+3*n.x/length,y:v.y+3*n.y/length}))));const shade=clamp(length*.16,12,48);tint.setAttribute('x1',m.x-n.x/length*shade);tint.setAttribute('y1',m.y-n.y/length*shade);tint.setAttribute('x2',m.x+n.x/length*4);tint.setAttribute('y2',m.y+n.y/length*4);const edge=front.filter(v=>Math.abs((v.x-m.x)*n.x+(v.y-m.y)*n.y)<.01);crease.setAttribute('d',edge.length>=2?'M'+edge[0].x+' '+edge[0].y+'L'+edge[1].x+' '+edge[1].y:'');}
function begin(direction){if(mode!=='idle'||index+direction<0||index+direction>=pages.length)return false;fold={direction,point:{x:direction===1?W-.2:.2,y:H-.2}};under.replaceChildren(pages[index+direction].content.cloneNode(true));curl.removeAttribute('hidden');paper.classList.add('turning');busy(true);mode='fold';draw(fold.point);return true;}
function clearFold(){current.style.clipPath='';under.replaceChildren();curl.setAttribute('hidden','');paper.classList.remove('turning');fold=null;}
function finish(commit){if(!fold)return;const direction=fold.direction;if(commit)index+=direction;clearFold();render();mode='idle';busy(false);paper.focus({preventScroll:true});}
function animate(commit){if(!fold)return;fold.commit=commit;mode='animating';drag=null;if(reduced.matches){finish(commit);return;}const start={...fold.point},direction=fold.direction,end={x:commit?(direction===1?-W-6:2*W+6):(direction===1?W-.2:.2),y:H-.2},t0=performance.now(),duration=commit?720:260;const tick=now=>{if(!fold)return;const t=Math.min((now-t0)/duration,1),ease=1-Math.pow(1-t,3),p={x:start.x+(end.x-start.x)*ease,y:start.y+(end.y-start.y)*ease-Math.sin(Math.PI*ease)*(commit?48:0)};draw(p);if(t<1)raf=requestAnimationFrame(tick);else finish(commit);};raf=requestAnimationFrame(tick);}
function turn(direction){if(begin(direction))animate(true);}
function position(event){const r=paper.getBoundingClientRect();return{x:(event.clientX-r.left)*W/r.width,y:(event.clientY-r.top)*H/r.height};}
cover.addEventListener('click',openBook);
paper.addEventListener('pointerdown',event=>{if(!event.isPrimary||event.button!==0||mode!=='idle')return;const p=position(event),direction=p.y>H-100?(p.x>W-75?1:p.x<75?-1:0):0;if(!direction||!begin(direction))return;event.preventDefault();paper.focus({preventScroll:true});drag={id:event.pointerId,start:p,moved:false};paper.setPointerCapture(event.pointerId);});
paper.addEventListener('pointermove',event=>{if(!drag||event.pointerId!==drag.id||mode!=='fold')return;const p=position(event);if(Math.hypot(p.x-drag.start.x,p.y-drag.start.y)>5)drag.moved=true;if(drag.moved){event.preventDefault();draw({x:clamp(p.x,-W-5,2*W+5),y:clamp(p.y,10,H-.2)});}});
paper.addEventListener('pointerup',event=>{if(!drag||event.pointerId!==drag.id)return;const moved=drag.moved,point=fold.point,direction=fold.direction;drag=null;if(paper.hasPointerCapture(event.pointerId))paper.releasePointerCapture(event.pointerId);const distance=direction===1?W-point.x:point.x;animate(!moved||distance>W*.35);});
paper.addEventListener('pointercancel',()=>{if(drag){drag=null;animate(false);}});
paper.addEventListener('lostpointercapture',()=>{if(drag){drag=null;animate(false);}});
document.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey||event.target.matches('input,textarea,select,[contenteditable="true"]'))return;if(event.key==='Escape'&&opened){event.preventDefault();closeBook();return;}if(mode==='closed'&&event.key==='ArrowRight'){event.preventDefault();openBook();return;}if(mode!=='idle')return;if(event.key==='ArrowRight'){event.preventDefault();turn(1);}if(event.key==='ArrowLeft'){event.preventDefault();turn(-1);}if(event.key==='Home'||event.key==='End'){event.preventDefault();index=event.key==='Home'?0:pages.length-1;render();}});
reduced.addEventListener('change',()=>{if(!reduced.matches)return;if(coverDone)coverDone();if(fold){cancelAnimationFrame(raf);finish(fold.commit===true);drag=null;}});
})();
</script>
