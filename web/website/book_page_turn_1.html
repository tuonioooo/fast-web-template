<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>一页之间 · 3D 翻书</title>
<style>
  :root{--ink:#153a3b;--cream:#f4f0e3;--mint:#b8d7c5;--accent:#d7c08b;--book-w:min(72vw,292px);--book-h:max(390px,calc(var(--book-w)*1.44));--turn-time:720ms}
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:#0b1d21;color:#e7eee8;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,#234b4c66,transparent 58%),linear-gradient(90deg,#ffffff04 1px,transparent 1px),linear-gradient(#ffffff04 1px,transparent 1px);background-size:auto,64px 64px,64px 64px}
  button{font:inherit;touch-action:manipulation} button:focus-visible{outline:3px solid #edd897;outline-offset:5px} button:disabled{cursor:not-allowed;opacity:.3}
  .experience{position:relative;width:min(100%,850px);padding:30px 16px 24px;text-align:center}
  .eyebrow{display:flex;align-items:center;justify-content:center;gap:10px;font-size:10px;letter-spacing:.25em;color:#9fb9b2;text-transform:uppercase}
  .eyebrow::before{content:"";width:6px;height:6px;background:#bfd8bd;border-radius:50%}
  h1{font-weight:450;font-size:clamp(25px,5vw,34px);letter-spacing:.16em;margin:13px 0 10px}
  .intro{font-size:12px;color:#8fa9a7;margin:0;line-height:1.8}
  .book-stage{height:calc(var(--book-h) + 74px);display:grid;place-items:center;position:relative;overflow:hidden;isolation:isolate;touch-action:pan-y}
  .book-stage::after{content:"";position:absolute;width:calc(var(--book-w)*1.1);height:24px;bottom:18px;border-radius:50%;background:#0008;filter:blur(14px);z-index:-1}
  .book{position:relative;width:var(--book-w);height:var(--book-h);perspective:1600px;perspective-origin:30% 50%;text-align:left;filter:drop-shadow(16px 15px 17px #0003)}
  .book::before{content:"";position:absolute;inset:6px -5px -5px 4px;border-radius:2px 9px 9px 2px;background:repeating-linear-gradient(#d3d0bb 0 1px,#ece8d6 1px 3px);box-shadow:2px 2px 0 #365958,4px 4px 0 #0c282c}
  .paper,.cover,.turn-layer{position:absolute;inset:0;border-radius:3px 8px 8px 3px}
  .paper{overflow:hidden;background:var(--cream);color:var(--ink);box-shadow:inset 10px 0 18px -14px #132f38cc}
  .page{height:100%;padding:24px 25px 22px 29px;position:relative;display:flex;flex-direction:column;overflow:hidden}
  .page::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#17323212,transparent 12%,transparent 96%,#fff7)}
  .folio{display:flex;justify-content:space-between;gap:10px;font-size:8px;letter-spacing:.19em;color:#677d75;text-transform:uppercase}
  .chapter{font-size:9px;letter-spacing:.22em;color:#7b8170;margin:23px 0 7px}
  .page h2{font-family:Georgia,"Songti SC","SimSun",serif;font-size:25px;letter-spacing:.08em;font-weight:400;margin:0 0 10px}
  .page p{font-family:Georgia,"Songti SC","SimSun",serif;font-size:12px;line-height:1.95;letter-spacing:.02em;margin:0 0 10px;color:#47605a}
  .page-art{width:100%;height:104px;flex-shrink:0;margin:4px 0 12px;display:block}
  .page-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:9px;color:#728078;letter-spacing:.12em;padding-top:9px;border-top:1px solid #153a3b22}
  .corner{border:0;background:none;color:#315e58;padding:7px 0 7px 9px;min-height:30px;cursor:pointer;position:relative;z-index:2;font-size:10px;letter-spacing:.04em}
  .page blockquote{margin:20px 0 15px;padding-left:12px;border-left:2px solid #9baf94;font-family:Georgia,"Songti SC","SimSun",serif;font-size:19px;line-height:1.7;color:#214a45}
  .cover{z-index:3;border:0;padding:0;background:#b8d7c5;color:var(--ink);cursor:pointer;overflow:hidden;box-shadow:inset 8px 0 10px #133f3828,inset 11px 0 1px #ffffff28;transform-origin:left center;transform:rotateY(-6deg);transition:transform 300ms ease;text-align:left}
  .cover:hover{transform:rotateY(-14deg)}
  .cover-inner{position:absolute;inset:15px 14px 15px 23px;border:1px solid #214e4a66;padding:20px 18px;display:flex;flex-direction:column;align-items:flex-start}
  .cover-series{font-size:8px;font-weight:600;letter-spacing:.25em}
  .cover-title{font-family:Georgia,"Songti SC","SimSun",serif;font-size:clamp(24px,6vw,33px);line-height:1.5;letter-spacing:.12em;margin:23px 0 9px}
  .cover-sub{font-size:8px;letter-spacing:.18em;color:#47685e}
  .cover-art{width:100%;height:125px;margin:auto 0 12px;overflow:visible}
  .cover-footer{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:8px;letter-spacing:.16em;border-top:1px solid #214e4a55;padding-top:12px}
  .cover-mark{width:20px;height:20px;border:1px solid currentColor;display:grid;place-items:center;border-radius:50%;font-size:10px}
  .turn-layer{z-index:5;transform-origin:left center;transform-style:preserve-3d;pointer-events:none;animation-duration:var(--turn-time);animation-fill-mode:both;animation-timing-function:cubic-bezier(.48,.04,.31,1)}
  .turn-layer.forward{animation-name:turn-forward}.turn-layer.backward{animation-name:turn-backward}
  .turn-front,.turn-back{position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--cream);color:var(--ink)}
  .turn-front{box-shadow:inset -12px 0 20px -16px #193d32aa}.turn-front::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 40%,#10392e22);opacity:.6}
  .turn-back{transform:rotateY(180deg);background:linear-gradient(90deg,#dcd9c7,var(--cream) 35%,#e7e4d2);box-shadow:inset -14px 0 25px -20px #082a29}
  .turn-layer.is-cover .turn-front{background:var(--mint);box-shadow:inset 8px 0 10px #133f3828}.turn-layer.is-cover .turn-back{background:#93b3a3}
  @keyframes turn-forward{0%{transform:rotateY(0deg);opacity:1}84%{opacity:1}100%{transform:rotateY(-178deg);opacity:0}}
  @keyframes turn-backward{0%{transform:rotateY(-178deg);opacity:0}16%{opacity:1}100%{transform:rotateY(0deg);opacity:1}}
  .controls{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 17px}
  .nav{border:1px solid #75918d55;border-radius:50%;width:44px;height:44px;color:#cadbd5;background:#ffffff04;cursor:pointer;display:grid;place-items:center;transition:background 150ms}
  .nav:not(:disabled):hover{background:#ffffff12}.nav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6}
  .toggle{min-width:132px;min-height:44px;border:1px solid #c1d5bc66;border-radius:24px;background:#c1d5bc;color:#183b39;font-size:12px;font-weight:600;letter-spacing:.06em;cursor:pointer;transition:background 150ms}
  .toggle:hover{background:#d5e3cf}
  .reading-meta{display:flex;justify-content:center;align-items:center;gap:15px;min-height:20px;color:#a1b8b1;font-size:10px;letter-spacing:.1em}
  .dots{display:flex;gap:6px}.dot{width:5px;height:5px;border-radius:50%;background:#78988c44;transition:background 200ms}.dot.active{background:#d7c08b}
  .help{font-size:10px;color:#77918e;line-height:1.8;margin:16px 0 0;letter-spacing:.02em}
  .help kbd{font:inherit;border:1px solid #6e8b8533;padding:1px 4px;border-radius:3px}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .no-script{color:#d9cda7;font-size:12px}
  @media(max-width:420px){.experience{padding-top:22px}.book-stage{height:calc(var(--book-h) + 58px)}.page{padding:19px 21px 17px 25px}.chapter{margin-top:18px}.page h2{font-size:23px}.page p{font-size:11px}.page-art{height:85px;margin-bottom:10px}.cover-inner{inset:13px 12px 13px 20px;padding:15px}.cover-title{margin-top:20px}.cover-art{height:105px}.intro{font-size:11px}.help{font-size:9px}}
  @media(max-width:340px){.page{padding:15px 18px 14px 22px}.page h2{font-size:21px}.page-art{height:68px}.chapter{margin-top:13px}.page p{line-height:1.8}.cover-title{margin-top:16px}.cover-art{height:85px}.cover-footer{font-size:7px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.cover,.cover:hover{transform:none}.turn-layer{display:none}}
</style>
</head>
<body>
<main class="experience" aria-labelledby="experience-title">
  <header><div class="eyebrow">Interactive paper / 02</div><h1 id="experience-title">一页之间</h1><p class="intro">给匆忙的日常，留一点翻页的时间。</p></header>
  <section class="book-stage" id="book-stage" aria-label="互动翻页书" aria-describedby="instructions">
    <div class="book" id="book" aria-busy="false">
      <div class="paper" id="paper" hidden></div>
      <button class="cover" id="cover" type="button" aria-label="打开《把时间翻慢一点》" aria-controls="paper" aria-expanded="false">
        <span class="cover-inner">
          <span class="cover-series">漫游手记 · VOL. 01</span>
          <span class="cover-title">把时间<br>翻慢一点</span>
          <span class="cover-sub">A SMALL ATLAS OF QUIET</span>
          <svg class="cover-art" viewBox="-3 -30 206 175" fill="none" aria-hidden="true"><circle cx="100" cy="52" r="34" fill="#dbca91"/><path d="M8 126V65a92 92 0 0 1 184 0v61M25 126V65a75 75 0 0 1 150 0v61M42 126V65a58 58 0 0 1 116 0v61" stroke="#315f56" stroke-width=".7"/><path d="m4 111 46-42 41 37 31-23 74 44H4Z" fill="#527c69"/><path d="m4 130 65-30 52 24 45-12 30 18" fill="#214b47"/><path d="M4 138h192" stroke="#214b47" stroke-width=".8"/></svg>
          <span class="cover-footer"><span>四个片刻 / FOUR MOMENTS</span><span class="cover-mark">↗</span></span>
        </span>
      </button>
    </div>
  </section>
  <nav class="controls" aria-label="翻书操作">
    <button class="nav" id="previous" type="button" aria-label="上一页" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg></button>
    <button class="toggle" id="toggle" type="button" aria-controls="paper" aria-expanded="false">翻开这本书</button>
    <button class="nav" id="next" type="button" aria-label="下一页" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6M16 12H4"/></svg></button>
  </nav>
  <div class="reading-meta"><span id="page-label">封面 / COVER</span><span class="dots" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></span></div>
  <p class="help" id="instructions">点击封面打开 · 点击页角或左右滑动翻页<br><kbd>←</kbd> <kbd>→</kbd> 翻页 · <kbd>Home</kbd> <kbd>End</kbd> 首尾 · <kbd>Esc</kbd> 合上</p>
  <div class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="no-script">请启用 JavaScript 体验翻页动画。</p></noscript>
</main>
<template id="page-1"><article class="page" aria-label="第 1 页：山间，留白"><div class="folio"><span>FIELD NOTES</span><span>01 / 04</span></div><div class="chapter">CHAPTER ONE · 山</div><h2>山间，留白</h2><svg class="page-art" viewBox="0 0 240 110" fill="none" aria-hidden="true"><rect width="240" height="110" rx="2" fill="#e2e7d5"/><circle cx="171" cy="30" r="17" fill="#d1b77e"/><path d="m0 100 70-73 51 52 37-31 82 62H0Z" fill="#8fa993"/><path d="m0 110 73-37 66 32 48-25 53 30" fill="#486e5e"/><path d="m70 27-8 23 9-6 8 8-9-25Z" fill="#f3efdf"/></svg><p>沿着山路慢慢走，不急着抵达。云从远处经过，树影在脚边停留。</p><p>空白不是遗漏，<br>是留给风和自己的位置。</p><footer class="page-foot"><span>一 / MOUNTAIN</span><button class="corner" type="button" data-next aria-label="翻到第 2 页">下一页 ↗</button></footer></article></template>
<template id="page-2"><article class="page" aria-label="第 2 页：听见潮汐"><div class="folio"><span>FIELD NOTES</span><span>02 / 04</span></div><div class="chapter">CHAPTER TWO · 海</div><h2>听见潮汐</h2><svg class="page-art" viewBox="0 0 240 110" fill="none" aria-hidden="true"><rect width="240" height="110" rx="2" fill="#d9e4dd"/><circle cx="63" cy="35" r="19" fill="#d4bc89"/><path d="M0 60q30-14 60 0t60 0t60 0t60 0v50H0Z" fill="#9bb8ae"/><path d="M0 80q30-14 60 0t60 0t60 0t60 0v30H0Z" fill="#5c8b82"/><path d="M0 100q30-14 60 0t60 0t60 0t60 0v10H0Z" fill="#285b59"/><path d="M145 36h29m-21 7h34" stroke="#f4f0e3" stroke-width="1.5"/></svg><p>海浪把每一次靠近，都写成新的句子。没有两次完全相同，也不必相同。</p><p>把思绪交给海面，<br>让它们缓缓展开。</p><footer class="page-foot"><span>二 / TIDE</span><button class="corner" type="button" data-next aria-label="翻到第 3 页">下一页 ↗</button></footer></article></template>
<template id="page-3"><article class="page" aria-label="第 3 页：一束微光"><div class="folio"><span>FIELD NOTES</span><span>03 / 04</span></div><div class="chapter">CHAPTER THREE · 光</div><h2>一束微光</h2><svg class="page-art" viewBox="0 0 240 110" fill="none" aria-hidden="true"><rect width="240" height="110" rx="2" fill="#dfe1cf"/><path d="M85 110V45a35 35 0 0 1 70 0v65" fill="#315c53"/><path d="M94 110V45a26 26 0 0 1 52 0v65" fill="#c2d1b7"/><path d="m120 25 26 21v40l69 24H58l36-24V46l26-21Z" fill="#d6bd83" opacity=".85"/><path d="M120 19v91M94 62h52" stroke="#315c53" stroke-width="3"/><path d="M35 110V82m-10 4 10 8 10-14" stroke="#6b8570" stroke-width="2"/></svg><p>午后的光穿过窗沿，停在尚未读完的那一页。小小的片刻，也值得认真收藏。</p><p>不必把每一天填满，<br>有光经过就很好。</p><footer class="page-foot"><span>三 / LIGHT</span><button class="corner" type="button" data-next aria-label="翻到第 4 页">下一页 ↗</button></footer></article></template>
<template id="page-4"><article class="page" aria-label="第 4 页：未完，待续"><div class="folio"><span>FIELD NOTES</span><span>04 / 04</span></div><div class="chapter">THE LAST PAGE · 此刻</div><h2>未完，待续</h2><blockquote>世界很大。<br>先把眼前这一页，<br>慢慢读完。</blockquote><p>合上书，带着一点安静回到日常。下一次打开，还会有新的风景。</p><div style="margin:auto 0 12px;font-size:30px;color:#92a58a" aria-hidden="true">✳</div><footer class="page-foot"><span>四 / BEGIN AGAIN</span><button class="corner" type="button" data-restart aria-label="回到第 1 页">再读一次 ↶</button></footer></article></template>
<script>
/* Independently authored demo. Inline artwork, CSS and JavaScript; no external assets or libraries. */
(() => {
  'use strict';
  const book = document.getElementById('book');
  const paper = document.getElementById('paper');
  const cover = document.getElementById('cover');
  const toggle = document.getElementById('toggle');
  const previous = document.getElementById('previous');
  const next = document.getElementById('next');
  const label = document.getElementById('page-label');
  const announcement = document.getElementById('announcement');
  const stage = document.getElementById('book-stage');
  const dots = [...document.querySelectorAll('.dot')];
  const templates = [...document.querySelectorAll('template')];
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let opened = false;
  let pageIndex = 0;
  let busy = false;
  let finishTurn = null;
  let pointerStart = null;

  function showPage(index) {
    paper.replaceChildren(templates[index].content.cloneNode(true));
  }
  function update(announce = true) {
    previous.disabled = !opened || busy || pageIndex === 0;
    next.disabled = !opened || busy || pageIndex === templates.length - 1;
    toggle.disabled = busy;
    cover.disabled = busy;
    cover.setAttribute('aria-expanded', String(opened));
    toggle.setAttribute('aria-expanded', String(opened));
    toggle.textContent = opened ? '合上，稍作停留' : '翻开这本书';
    book.setAttribute('aria-busy', String(busy));
    paper.inert = busy || !opened;
    label.textContent = opened ? `第 ${pageIndex + 1} 页 / 共 ${templates.length} 页` : '封面 / COVER';
    dots.forEach((dot, i) => dot.classList.toggle('active', opened && i === pageIndex));
    if (announce) announcement.textContent = opened ? paper.querySelector('article').getAttribute('aria-label') : '书已合上。可以点击封面再次打开。';
  }
  function turn(markup, backward, isCover, done) {
    if (reducedMotion.matches) { done(); return; }
    busy = true;
    update(false);
    const layer = document.createElement('div');
    layer.className = `turn-layer ${backward ? 'backward' : 'forward'}${isCover ? ' is-cover' : ''}`;
    layer.setAttribute('aria-hidden', 'true');
    layer.inert = true;
    const front = document.createElement('div');
    front.className = 'turn-front';
    front.innerHTML = markup;
    const back = document.createElement('div');
    back.className = 'turn-back';
    layer.append(front, back);
    book.append(layer);
    let finished = false;
    const cleanup = () => {
      if (finished) return;
      finished = true;
      clearTimeout(fallback);
      layer.remove();
      busy = false;
      finishTurn = null;
      done();
    };
    const fallback = setTimeout(cleanup, 850);
    finishTurn = cleanup;
    layer.addEventListener('animationend', cleanup, { once: true });
    layer.addEventListener('animationcancel', cleanup, { once: true });
  }
  function openBook() {
    if (opened || busy) return;
    pageIndex = 0;
    showPage(pageIndex);
    paper.hidden = false;
    const markup = cover.innerHTML;
    cover.hidden = true;
    opened = true;
    turn(markup, false, true, () => { update(); toggle.focus({ preventScroll: true }); });
  }
  function closeBook() {
    if (!opened || busy) return;
    turn(cover.innerHTML, true, true, () => {
      opened = false;
      paper.hidden = true;
      cover.hidden = false;
      update();
      cover.focus({ preventScroll: true });
    });
  }
  function goTo(index) {
    if (!opened || busy || index < 0 || index >= templates.length || index === pageIndex) return;
    const focusBefore = document.activeElement;
    const focusWasInPaper = paper.contains(focusBefore);
    const restoreFocus = () => {
      const active = document.activeElement;
      if (active !== document.body && active !== focusBefore && !paper.contains(active)) return;
      if (focusWasInPaper) toggle.focus({ preventScroll: true });
      else if ([previous, next, toggle].includes(focusBefore)) {
        (focusBefore.disabled ? toggle : focusBefore).focus({ preventScroll: true });
      }
    };
    const backward = index < pageIndex;
    const oldMarkup = paper.innerHTML;
    if (backward) {
      const holder = document.createElement('div');
      holder.append(templates[index].content.cloneNode(true));
      turn(holder.innerHTML, true, false, () => {
        pageIndex = index; showPage(index); update();
        restoreFocus();
      });
    } else {
      showPage(index);
      turn(oldMarkup, false, false, () => {
        pageIndex = index; update();
        restoreFocus();
      });
    }
  }
  cover.addEventListener('click', openBook);
  toggle.addEventListener('click', () => opened ? closeBook() : openBook());
  previous.addEventListener('click', () => goTo(pageIndex - 1));
  next.addEventListener('click', () => goTo(pageIndex + 1));
  paper.addEventListener('click', event => {
    if (event.target.closest('[data-next]')) goTo(pageIndex + 1);
    if (event.target.closest('[data-restart]')) goTo(0);
  });
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || event.target.matches('input,textarea,select,[contenteditable="true"]')) return;
    if (event.key === 'Escape' && opened) {
      event.preventDefault();
      if (finishTurn) finishTurn();
      closeBook();
      return;
    }
    if (busy) return;
    if (event.key === 'ArrowRight') { event.preventDefault(); opened ? goTo(pageIndex + 1) : openBook(); }
    if (event.key === 'ArrowLeft' && opened) { event.preventDefault(); goTo(pageIndex - 1); }
    if (event.key === 'Home' && opened) { event.preventDefault(); goTo(0); }
    if (event.key === 'End' && opened) { event.preventDefault(); goTo(templates.length - 1); }
  });
  stage.addEventListener('pointerdown', event => {
    if (event.isPrimary && event.pointerType !== 'mouse' && opened && !busy) pointerStart = { x: event.clientX, y: event.clientY, id: event.pointerId };
  });
  stage.addEventListener('pointerup', event => {
    if (!pointerStart || pointerStart.id !== event.pointerId) return;
    const dx = event.clientX - pointerStart.x;
    const dy = event.clientY - pointerStart.y;
    pointerStart = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) goTo(pageIndex + (dx < 0 ? 1 : -1));
  });
  stage.addEventListener('pointercancel', () => { pointerStart = null; });
  reducedMotion.addEventListener('change', () => { if (reducedMotion.matches && finishTurn) finishTurn(); });
  update(false);
})();
</script>
</body>
</html>
